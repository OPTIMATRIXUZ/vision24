# Vision24 — nginx site config for app.vision24.uz + media.vision24.uz.
# Install: copy to /etc/nginx/sites-available/vision24.conf, symlink into
# sites-enabled, create the htpasswd file, `nginx -t`, reload. Run certbot
# AFTER this is live — `certbot --nginx -d app.vision24.uz -d media.vision24.uz`
# rewrites these blocks in place to add TLS and the HTTP→HTTPS redirect, and it
# preserves every directive below. Full walkthrough in DEPLOYMENT.md.
#
# Topology this encodes (single-domain by design — the frontend only ever calls
# relative /api/* paths, so no api.vision24.uz):
#
#   app.vision24.uz/api/*  → FastAPI  127.0.0.1:8020  (bypasses the Next proxy)
#   app.vision24.uz/*      → Next.js  127.0.0.1:3001
#   media.vision24.uz/*    → MinIO    127.0.0.1:9000  (presigned URLs only)

# WebSocket upgrade helper — used by the optional /go2rtc/ location.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.vision24.uz;

    # The application's own auth is bypassed (anonymous requests get owner
    # rights — see DEPLOYMENT.md "Security model"). This Basic Auth prompt is
    # the ONLY thing standing between the internet and destructive endpoints.
    # Do not remove it until real auth is restored in the app.
    auth_basic           "Vision24";
    auth_basic_user_file /etc/nginx/.htpasswd-vision24;

    add_header X-Content-Type-Options nosniff always;

    # Credential-free probes for uptime monitoring. /api/health is DB-free
    # liveness; /api/ready checks Postgres + MinIO and returns 503 until both
    # are up. Neither leaks data.
    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
    }
    location = /api/ready {
        auth_basic off;
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
    }

    # Chat answers stream as SSE over a POST. Buffering must be off end to end
    # or the whole reply arrives in one lump when the model finishes. The long
    # read timeout covers multi-round tool calls (the LLM may fetch and analyse
    # camera frames mid-answer).
    location = /api/chat/stream {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Everything else under /api goes straight to FastAPI. Routing here instead
    # of through the Next proxy keeps cookies first-party (same origin) while
    # sparing the Node process from relaying 2 GB uploads.
    #
    #   client_max_body_size 2g       — video uploads; matches the app's own cap
    #   proxy_request_buffering off   — stream uploads through instead of
    #                                   spooling 2 GB to nginx's temp dir first
    #   proxy_read_timeout 300s       — /api/report and /api/live/commentary
    #                                   call the LLM synchronously
    location /api/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- OPTIONAL: go2rtc live streaming ------------------------------------
    # Uncomment when enabling live RTSP cameras (DEPLOYMENT.md §12). The live
    # page iframes /go2rtc/stream.html; signalling upgrades to a WebSocket,
    # hence the Upgrade headers. WebRTC media itself flows over port 8555
    # directly — nginx never sees it.
    #
    # location /go2rtc/ {
    #     proxy_pass http://127.0.0.1:1984/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_buffering off;
    #     proxy_read_timeout 3600s;
    # }
    # -------------------------------------------------------------------------

    # Next.js standalone server renders every page — plain proxy, and
    # deliberately NO `try_files ... /index.html`: there is no static index.html
    # to fall back to in an App Router deployment.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# MinIO — serves clips, snapshots, heatmaps and processed videos to the browser
# via presigned URLs. Deliberately NO Basic Auth here: browsers won't prompt for
# credentials on <img>/<video> subresources, and the presigned signature (1 h
# expiry) is itself the access control.
#
# The signature also covers the Host header. `proxy_set_header Host $host` is
# load-bearing — rewrite the host and every media URL fails with
# SignatureDoesNotMatch.
server {
    listen 80;
    listen [::]:80;
    server_name media.vision24.uz;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;          # stream video instead of spooling to disk
        proxy_read_timeout 300s;
    }
}
