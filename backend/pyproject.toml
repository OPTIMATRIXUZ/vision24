[project]
name = "vision24-backend"
version = "0.1.0"
description = "Vision 24 MVP — API + detection worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.139",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "minio>=7.2",
    "urllib3>=2.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "httpx>=0.27",
    "google-genai>=1.21",
    "openai>=1.60",
    "opencv-python>=4.10",
    "ultralytics>=8.4.91",
    "clip @ git+https://github.com/ultralytics/CLIP.git",
    "torch>=2.6",
    # Direct dep only so [tool.uv.sources] can route it — uv sources don't
    # apply to transitive packages, and clip/open_clip pull it in regardless.
    "torchvision>=0.21",
    "pgvector>=0.4",
    "open_clip_torch>=3.0",
    "lap>=0.5.12",
    "shapely>=2.0",
    "supervision>=0.25",
    "requests>=2.32",
    "python-multipart>=0.0.9",
    "mlx-audio>=0.4.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "time-machine>=2.16",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
# torchvision must ride the same index: the PyPI wheel is compiled against the
# CUDA-default torch build, and pairing it with torch +cpu leaves its C extension
# unable to register ops ("operator torchvision::nms does not exist" at import).
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.setuptools]
packages = ["app", "app.routers", "app.services", "app.services.ai", "worker"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "LOG",
    "G",
    "TID252",
    "BLE",
    "RUF",
]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"worker/camera_main.py" = ["I001"]
"worker/detector.py" = ["I001"]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config -m 'not gpu and not slow'"
pythonpath = ["."]
markers = [
    "unit: no DB, no network, no torch — the whole set should run in ~2s",
    "db: needs the dockerized Postgres",
    "integration: needs MinIO and/or ffmpeg",
    "gpu: needs model weights and a GPU; imports ultralytics",
    "slow: takes more than 5 seconds",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["^\\.venv/", "^migrations/"]

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "ultralytics.*",
    "open_clip.*",
    "mlx_audio.*",
    "supervision.*",
    "minio.*",
    "pgvector.*",
    "shapely.*",
    "lap.*",
]
ignore_missing_imports = true
