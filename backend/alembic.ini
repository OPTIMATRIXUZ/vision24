# Alembic config. The database URL is deliberately NOT set here — migrations/env.py
# reads it from app.config.Settings so there is exactly one source of truth and no
# risk of this file and .env disagreeing about which database gets migrated.

[alembic]
script_location = migrations
prepend_sys_path = .
# Without this Alembic warns and falls back to splitting the path on spaces,
# commas and colons — which breaks on any checkout path containing them.
path_separator = os
file_template = %%(rev)s_%%(slug)s
# Revision ids are hand-set (0001, 0002, ...) so the order is obvious on disk.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
